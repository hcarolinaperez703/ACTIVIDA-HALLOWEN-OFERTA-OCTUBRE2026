<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a0845" />
      <stop offset="100%" stop-color="#150a24" />
    </radialGradient>
    <linearGradient id="claroRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5a6a" />
      <stop offset="100%" stop-color="#e2001a" />
    </linearGradient>
    <linearGradient id="pumpkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffaa40" />
      <stop offset="100%" stop-color="#ff7a29" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="url(#claroRed)" stroke-width="6" opacity="0.6" />

  <!-- Ghost Silhouette (Fantasma Claro) -->
  <g filter="url(#neonGlow)">
    <path d="M 256,90 C 180,90 140,140 140,220 C 140,290 160,330 140,370 C 130,390 150,400 170,385 C 190,370 210,385 230,370 C 250,355 262,355 282,370 C 302,385 322,370 342,385 C 362,400 382,390 372,370 C 352,330 372,290 372,220 C 372,140 332,90 256,90 Z" fill="url(#claroRed)" opacity="0.95" />
    <!-- Ghost Eyes -->
    <ellipse cx="215" cy="205" rx="18" ry="24" fill="#150a24" />
    <ellipse cx="297" cy="205" rx="18" ry="24" fill="#150a24" />
    <circle cx="210" cy="198" r="6" fill="#fff" />
    <circle cx="292" cy="198" r="6" fill="#fff" />
    <!-- Ghost Smile -->
    <path d="M 226,260 Q 256,290 286,260" stroke="#150a24" stroke-width="8" stroke-linecap="round" fill="none" />
  </g>

  <!-- Crossed Swords / Halloween Emblems -->
  <circle cx="256" cy="425" r="28" fill="url(#pumpkin)" />
  <text x="256" y="435" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#150a24" text-anchor="middle">⚔</text>

  <!-- Brand Subtext -->
  <text x="256" y="480" font-family="'Cinzel', serif" font-weight="900" font-size="20" fill="#f3ead3" letter-spacing="4" text-anchor="middle">CLARO DUELOS</text>
</svg>
